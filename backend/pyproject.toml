[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API: serves the document catalog, the fake login, and the built frontend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx2>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prelegal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
